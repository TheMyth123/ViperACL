services:
  neo4j:
    image: neo4j:5.26-community
    container_name: viperacl-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/viperacl
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p viperacl 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  app:
    build: .
    container_name: viperacl-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      VIPERACL_WEB_HOST: "0.0.0.0"
      VIPERACL_WEB_PORT: "8000"
      VIPERACL_NEO4J_URI: "bolt://neo4j:7687"
      VIPERACL_NEO4J_USERNAME: "neo4j"
      VIPERACL_NEO4J_PASSWORD: "viperacl"
      VIPERACL_NEO4J_DATABASE: "neo4j"
    volumes:
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins: